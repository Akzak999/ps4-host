<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#020817;color:#fff;
  font:15px/1.45 "Segoe UI",system-ui,sans-serif;
}
body{
  background:url("zaki-bg.png") center center/cover no-repeat;
}
body:before{
  content:"";position:fixed;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.64),rgba(0,8,24,.20),rgba(0,0,0,.42));
  pointer-events:none;
}
#wrap{position:relative;z-index:2;padding:28px 34px;}
#state{font-size:22px;font-weight:700;margin:0 0 10px;text-shadow:0 2px 10px rgba(0,0,0,.8);}
#out{
  white-space:pre-wrap;font:12px/1.45 Consolas,monospace;
  background:rgba(3,8,23,.72);
  border:1px solid rgba(0,180,216,.38);
  border-radius:12px;padding:10px 12px;
  height:calc(100vh - 141px);overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
  backdrop-filter:blur(5px);
}
.ok{color:#8ff0b8}.bad{color:#ff9a91}.warn{color:#ffe08a}
#brand{text-align:center;padding:8px 10px;background:rgba(3,8,23,.45);
       border-bottom:1px solid rgba(0,180,216,.25);}
#brand b{font-size:30px;font-weight:800;letter-spacing:4px;
         color:#fff;vertical-align:middle;text-shadow:0 2px 12px rgba(0,0,0,.8);}
#subtitle{text-align:center;font-size:14px;letter-spacing:3px;opacity:.9;margin-top:4px;}
</style>
</head>
<body>
<div id="brand"><b>ZAKI GAME ARENA</b><div id="subtitle">PS4 HOST</div></div>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
