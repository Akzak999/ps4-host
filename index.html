<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaki Game Arena - PS4 Exploit</title>
<style>
  html, body { 
    margin: 0; padding: 0; 
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed; 
    background-size: cover;
    color: #c8ced8; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; 
  }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(11, 13, 16, 0.88); z-index: -1;
  }
  #brand { 
    text-align: center; padding: 14px 10px; background: rgba(14, 17, 22, 0.95);
    border-bottom: 2px solid #1e2732;
  }
  #brand b { font-size: 18px; font-weight: 700; letter-spacing: .14em; color: #e6ebf2; }
  
  #wrap { padding: 25px 30px; max-width: 800px; margin: 40px auto; background: rgba(17, 21, 27, 0.9); border: 1px solid #1e2732; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
  
  #profile-container { margin-bottom: 20px; }
  #profile-container img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #7fd0a0; box-shadow: 0 0 15px rgba(127, 208, 160, 0.4); object-fit: cover; }

  #state { font-size: 22px; font-weight: 700; margin: 0 0 10px; color: #fff; }
  #det { font-size: 14px; color: #8b95a3; margin: 0 0 10px; }
  #det b { color: #c8ced8; font-weight: 600; }
  
  #cache { font-size: 13px; color: #d8c07f; margin: 10px 0; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 6px; }
  #cache.cacheok { color: #7fd0a0; background: rgba(127, 208, 160, 0.1); }

  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace;
         background: #11151b; border: 1px solid #1e2732; border-radius: 5px;
         padding: 10px 12px; height: 180px; overflow-y: auto; text-align: left; direction: ltr; margin-top: 15px; }
  
  .ok { color: #7fd0a0; } .bad { color: #d08a7f; } .warn { color: #d8c07f; }
</style>
</head>
<body>

<div id="brand">
    <b>ZAKI GAME ARENA | PLAYSTATION HOST</b>
</div>

<div id="wrap">
  <div id="profile-container">
      <img src="profile.jpg" alt="Zaki">
  </div>
  
  <div id="state">جاري فحص الإصدار...</div>
  <div id="det"></div>
  <div id="cache">جاري التحقق من التخزين المؤقت...</div>
  <div id="out"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "الإصدار المكتشف: <b>" + (key || "غير معروف") + "</b> &middot; الثغرة: <b>" + (bug || "لا توجد") + "</b>";

    if (!bug) { setState("إصدار غير مدعوم", "bad"); return; }

    function runExploit() {
        setState("جاري حقن وتشغيل ثغرة " + bug + "...", "warn");
        // هنا يتم استدعاء ملف الثغرة مباشرة في نفس الصفحة دون مغادرتها
        var s = document.createElement("script");
        s.type = "module";
        s.src = (bug === "lapse" ? "chain_lapse.js" : "chain_poops.js");
        document.body.appendChild(s);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        runExploit();
    } else if (!navigator.onLine) {
        setCache("وضع عدم الاتصال -- يتم التشغيل من الكاش", true);
        runExploit();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين المؤقت بنجاح (Cached)", true);
        runExploit();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("التحديث جاهز", true);
        waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتفعيل",
                   function () { location.reload(); });
    } else {
        setCache("جاري فحص الكاش...");
        ac.addEventListener("downloading",
            function () { setCache("جاري التخزين المؤقت للاستخدام بدون إنترنت..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جاري التحميل " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("تم التخزين المؤقت بنجاح للاستخدام بدون إنترنت", true);
            waitForTap("تم التخزين بنجاح -- اضغط X أو انقر للبدء", runExploit);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("التحديث جاهز", true);
            waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل",
                        function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("الكاش مخزن -- جاهز بدون إنترنت", true);
            runExploit();
        }, false);
        ac.addEventListener("error", function () {
            setCache("تعذر الاتصال بالكاش");
            waitForTap("فشل الكاش -- اضغط X أو انقر للتشغيل على أي حال", runExploit);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الكاش أصبح قديمًا");
            waitForTap("الكاش قديم -- اضغط X أو انقر للتشغيل", runExploit);
        }, false);
    }
})();
</script>

</body>
</html>
