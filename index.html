<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaki Game Arena - PS4 Exploit</title>
<style>
  html, body { 
    margin: 0; padding: 0; 
    background: #0b0d10 url('bg.jpg') no-repeat center center fixed; 
    background-size: cover;
    color: #c8ced8; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; 
  }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(11, 13, 16, 0.85); z-index: -1;
  }
  #brand { 
    text-align: center; padding: 12px 10px; background: rgba(14, 17, 22, 0.95);
    border-bottom: 2px solid #1e2732;
  }
  #brand b { font-size: 17px; font-weight: 700; letter-spacing: .1em; color: #e6ebf2; }
  
  .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
  
  /* شريط المعلومات العلوي */
  .info-box {
    background: rgba(17, 21, 27, 0.9); border: 1px solid #1e2732; border-radius: 10px;
    padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  }
  .info-box img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #7fd0a0; object-fit: cover; }
  .info-text h2 { margin: 0 0 5px; font-size: 20px; color: #fff; }
  .info-text p { margin: 3px 0; font-size: 14px; color: #8b95a3; }
  .info-text p b { color: #c8ced8; }

  /* شبكة الألعاب والأزرار القديمة */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .card {
    background: rgba(17, 21, 27, 0.85); border: 1px solid #1e2732; border-radius: 8px;
    overflow: hidden; text-align: center; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .card:hover { border-color: #7fd0a0; transform: translateY(-3px); }
  .card img { width: 100%; height: 110px; object-fit: cover; border-bottom: 1px solid #1e2732; }
  .card .title { padding: 10px; font-weight: 600; font-size: 14px; color: #e6ebf2; }

  #cache-status { font-size: 13px; color: #d8c07f; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; }
  #cache-status.cacheok { color: #7fd0a0; background: rgba(127, 208, 160, 0.1); }

  .ok { color: #7fd0a0; } .bad { color: #d08a7f; } .warn { color: #d8c07f; }
</style>
</head>
<body>

<div id="brand">
    <b>ZAKI GAME ARENA | PLAYSTATION HOST</b>
</div>

<div class="container">
  <!-- شريط المعلومات وصورتك -->
  <div class="info-box">
      <img src="profile.jpg" alt="Zaki">
      <div class="info-text">
          <h2 id="state">جاري فحص الإصدار...</h2>
          <p id="det"></p>
      </div>
  </div>

  <div id="cache-status">جاري التحقق من التخزين المؤقت...</div>

  <!-- الأزرار والصور القديمة -->
  <div class="grid">
      <div class="card">
          <img src="gow.jpg" alt="God of War">
          <div class="title">God of War</div>
      </div>
      <div class="card">
          <img src="spiderman.jpg" alt="Spider-Man">
          <div class="title">Spider-Man</div>
      </div>
      <div class="card">
          <img src="uncharted.jpg" alt="Uncharted">
          <div class="title">Uncharted 4</div>
      </div>
      <div class="card">
          <img src="tools.jpg" alt="Tools">
          <div class="title">GoldHEN & Tools</div>
      </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache-status");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug";
    }
    detEl.innerHTML = "الإصدار المكتشف: <b>" + (key || "غير معروف") + "</b> &middot; الثغرة: <b>" + (bug || "لا توجد") + "</b>";

    if (!bug) { setState("إصدار غير مدعوم", "bad"); return; }

    function runExploit() {
        setState("جاري تشغيل ثغرة " + bug + "...", "warn");
        var s = document.createElement("script");
        s.type = "module";
        s.src = (bug === "lapse" ? "chain_lapse.js" : "chain_poops.js");
        document.body.appendChild(s);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        runExploit();
    } else if (!navigator.onLine) {
        setCache("وضع عدم الاتصال -- يتم التشغيل من الكاش", true);
        runExploit();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين المؤقت بنجاح (Cached)", true);
        runExploit();
    } else {
        setCache("جاري فحص الكاش والتخزين...");
        ac.addEventListener("cached", function () {
            setCache("تم التخزين بنجاح للاستخدام بدون إنترنت", true);
            runExploit();
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("الكاش مخزن -- جاهز بدون إنترنت", true);
            runExploit();
        }, false);
        ac.addEventListener("error", function () {
            setCache("تعذر الاتصال بالكاش - جاري التشغيل...");
            runExploit();
        }, false);
    }
})();
</script>

</body>
</html>
