<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAKI GAME ARENA | PS4 HOST</title>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#020817;color:#fff;
  font:15px/1.45 "Segoe UI",system-ui,sans-serif;
}
body{
  background:url("zaki-bg.png") center center/cover no-repeat;
}
body:before{
  content:"";position:fixed;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,8,24,.18),rgba(0,0,0,.38));
  pointer-events:none;
}
#wrap{position:relative;z-index:2;padding:28px 34px;}
#brand{
  font-size:30px;font-weight:800;letter-spacing:4px;
  text-align:center;margin-top:8px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
#sub{
  text-align:center;font-size:14px;letter-spacing:3px;
  opacity:.9;margin-top:4px;
}
#panel{
  margin:38px auto 0;max-width:760px;
  padding:20px 24px;border-radius:14px;
  background:rgba(3,8,23,.66);
  border:1px solid rgba(0,180,216,.38);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
  backdrop-filter:blur(5px);
}
#state{font-size:22px;font-weight:700;margin:0 0 8px;}
#det{font-size:14px;color:#d5e2ef;margin:0 0 5px;}
#det b{color:#fff;font-weight:700;}
#cache{font-size:13px;color:#b9c8d8;min-height:18px;}
#cache.cacheok{color:#8ff0b8;}
.ok{color:#8ff0b8}.bad{color:#ff9a91}.warn{color:#ffe08a}
#hint{
  text-align:center;margin-top:18px;font-size:13px;
  color:#d7e8f5;opacity:.9;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="brand">ZAKI GAME ARENA</div>
  <div id="sub">PS4 HOST</div>
  <div id="panel">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="hint">Press X or tap to run</div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
    }
    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced;
        why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse";
        why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops";
        why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }

    detEl.innerHTML = "firmware <b>" + (key || "unknown") +
        "</b> &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;

    function go() {
        setState("loading " + bug + " chain...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () {
            setCache("caching for offline (first run)...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
