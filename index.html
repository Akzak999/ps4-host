<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">

    <!-- ربط ملفات الثغرة والذاكرة الأساسية -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0b0f19 url('bg.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .container { max-width: 1000px; width: 100%; background: rgba(11, 15, 25, 0.85); padding: 20px; border-radius: 20px; backdrop-filter: blur(5px); }
        
        .header {
            background: linear-gradient(135deg, rgba(19, 28, 46, 0.9), rgba(11, 15, 25, 0.9));
            border: 2px solid #1d4ed8;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 25px rgba(29, 78, 216, 0.4);
            margin-bottom: 25px;
        }
        .profile-section { display: flex; align-items: center; gap: 15px; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #38bdf8; object-fit: cover; box-shadow: 0 0 10px #38bdf8; }
        .user-info h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 5px; }
        .user-info p { color: #94a3b8; font-size: 0.9rem; }
        .logo-title { text-align: left; border-left: 2px solid #1d4ed8; padding-left: 15px; }
        .logo-title h1 { font-size: 1.8rem; color: #60a5fa; letter-spacing: 2px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }
        .logo-title span { color: #3b82f6; font-size: 0.8rem; display: block; }

        .status-bar {
            background: rgba(30, 41, 59, 0.9);
            border-right: 4px solid #38bdf8;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* شاشة الكاش وحالة التخزين المؤقت */
        #cache {
            background: rgba(15, 23, 42, 0.8);
            border-right: 4px solid #64748b;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
            text-align: right;
        }
        #cache.cacheok { color: #7fd0a0; border-color: #7fd0a0; }

        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

        .payload-card {
            position: relative;
            background: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            height: 295px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            outline: none;
            width: 100%;
        }

        .payload-card:focus, .payload-card:hover {
            transform: translateY(-3px);
            border-color: #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.8);
        }

        .payload-card img.bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .payload-content {
            position: relative;
            z-index: 2;
            background: linear-gradient(0deg, rgba(11, 15, 25, 0.95) 20%, transparent);
            padding: 20px 15px 15px 15px;
            text-align: center;
            width: 100%;
        }
        .payload-content h2 { color: #ffffff; text-shadow: 0 0 10px #000; font-size: 1.4rem; }
        .payload-content p { color: #38bdf8; text-shadow: 0 0 8px #000; font-weight: bold; margin-top: 4px; font-size: 0.85rem; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .game-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            outline: none;
            width: 100%;
        }

        .game-card:focus, .game-card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .game-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .game-title { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(15, 23, 42, 0.95), transparent); padding: 10px; font-size: 0.9rem; font-weight: bold; color: #f8fafc; }

        /* صندوق السجلات */
        .console-box {
            display: none;
            margin-top: 20px;
            background: #020617;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            color: #34d399;
            max-height: 220px;
            overflow-y: auto;
            text-align: left;
            direction: ltr;
            font-size: 0.8rem;
        }

        .footer-bar { margin-top: 30px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid #1e293b; padding: 15px; border-radius: 10px; color: #10b981; font-weight: bold; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="profile-section">
                <img src="profile.jpg" alt="Zaki" class="profile-img">
                <div class="user-info">
                    <h2>أهلاً بك، زكي!</h2>
                    <p>PLAYSTATION | PC GAMING | صيانة | فلاش ألعاب</p>
                </div>
            </div>
            <div class="logo-title">
                <h1>ZAKI</h1>
                <span>GAME ARENA</span>
            </div>
        </div>

        <!-- Status & Firmware Detection Bar (من كود المطور الأصلي) -->
        <div class="status-bar" id="state">جاري فحص إصدار السوفتوير...</div>
        <div id="cache">جاري التحقق من الذاكرة المؤقتة...</div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Left Side: Payload / Exploit Trigger Button -->
            <button class="payload-card" id="exploit-btn" onclick="executeZakiExploit()">
                <img src="goldhen-user.jpg" alt="Zaki Payload" class="bg-img">
                <div class="payload-content">
                    <h2>PAYLOAD MENU</h2>
                    <p id="btn-text">تشغيل الاستغلال الذكي</p>
                </div>
            </button>

            <!-- Right Side: Game Buttons -->
            <div class="games-grid">
                <button class="game-card" onclick="loadTool('God of War')">
                    <img src="gow.jpg" alt="God of War">
                    <div class="game-title">God of War (2018)</div>
                </button>

                <button class="game-card" onclick="loadTool('Spider-Man')">
                    <img src="spiderman.jpg" alt="Spider-Man">
                    <div class="game-title">Spider-Man</div>
                </button>

                <button class="game-card" onclick="loadTool('Uncharted 4')">
                    <img src="uncharted.jpg" alt="Uncharted 4">
                    <div class="game-title">Uncharted 4</div>
                </button>

                <button class="game-card" onclick="loadTool('App2USB')">
                    <img src="tools.jpg" alt="Tools">
                    <div class="game-title">أدوات الصيانة &amp; LaunchPad</div>
                </button>
            </div>
        </div>

        <!-- صندوق السجلات -->
        <div class="console-box" id="consoleBox">
            [+] ZAKI GAME ARENA: Smart Exploit Initialized.<br>
        </div>

        <!-- Footer Notification -->
        <div class="footer-bar" id="notification">
            جاهز لحقن الحمولة بناءً على إصدار جهازك تلقائياً.
        </div>
    </div>

    <script>
    (function () {
        var stateEl = document.getElementById("state");
        var cacheEl = document.getElementById("cache");
        function setState(t, c) { stateEl.textContent = t; stateEl.className = "status-bar " + (c || ""); }
        function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
        var params = new URLSearchParams(location.search);

        var key = null, fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
            var minor = parseInt(m[2], 16);
            var ms = minor.toString(16);
            if (ms.length < 2) ms = "0" + ms;
            key = m[1] + "." + ms;
            fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }
        var bug = null, why = "";
        var forced = params.get("bug");
        if (forced === "lapse" || forced === "poops") {
            bug = forced; why = "مفرض يدويًا عبر ?bug=" + forced;
        } else if (!key) {
            why = "المتصفح الحالي ليس جهاز PlayStation 4 (وضع المعاينة)";
        } else if (fwnum <= 1202) {
            bug = "lapse"; why = key + " <= 12.02 (تفعيل ثغرة lapse)";
        } else if (fwnum >= 1250) {
            bug = "poops"; why = key + " >= 12.50 (تفعيل ثغرة poops)";
        } else {
            why = key + " -- إصدار غير مدعوم حالياً";
        }

        // عرض النتيجة على واجهة زكي
        if (key) {
            stateEl.innerHTML = "🎮 الإصدار المكتشف: <b>" + key + "</b> &middot; الثغرة: <b>" + (bug || "غير مدعوم") + "</b> (" + why + ")";
        } else {
            stateEl.innerHTML = "💻 وضع المعاينة للكمبيوتر (أو متصفح خارجي)";
        }

        // نظام إدارة الكاش (Application Cache) المأخوذ من كود المطور الأصلي
        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
            setCache("التخزين المؤقت غير مفعل", false);
        } else if (!navigator.onLine) {
            setCache("وضع بدون إنترنت (Offline -- من الكاش)", true);
        } else if (ac.status === ac.IDLE) {
            setCache("تم التخزين المؤقت بنجاح (Cached)", true);
        } else if (ac.status === ac.UPDATEREADY) {
            try { ac.swapCache(); } catch (e) {}
            setCache("تحديث جديد جاهز (Update downloaded)", true);
        } else {
            setCache("جاري فحص الكاش...");
            ac.addEventListener("downloading", function () { setCache("جاري التحميل للعمل بدون إنترنت..."); }, false);
            ac.addEventListener("progress", function (e) {
                if (e && e.total) setCache("جاري التحميل: " + Math.round((e.loaded / e.total) * 100) + "%");
            }, false);
            ac.addEventListener("cached", function () { setCache("تم التخزين للاستخدام بدون إنترنت بنجاح", true); }, false);
            ac.addEventListener("updateready", function () {
                try { ac.swapCache(); } catch (e) {}
                setCache("تم تنزيل التحديث بنجاح", true);
            }, false);
            ac.addEventListener("noupdate", function () { setCache("الكاش محدث -- جاهز للعمل بدون إنترنت", true); }, false);
            ac.addEventListener("error", function () { setCache("تعذر الاتصال بالكاش"); }, false);
            ac.addEventListener("obsolete", function () { setCache("الكاش أصبح قديمًا (Obsolete)"); }, false);
        }

        // دالة التنفيذ عند الضغط على زر الـ Payload في واجهة ZAKI GAME ARENA
        window.executeZakiExploit = function() {
            let consoleBox = document.getElementById('consoleBox');
            let notification = document.getElementById('notification');
            
            consoleBox.style.display = "block";
            notification.innerText = "جاري تنفيذ الثغرة وإرسال الحمولة (payload.bin)...";

            setTimeout(() => { consoleBox.innerHTML += "[+] ZAKI GAME ARENA: Target Firmware: " + (key || "Simulated") + "<br>"; }, 400);
            setTimeout(() => { consoleBox.innerHTML += "[+] Loading memory management and ROP chain...<br>"; }, 1000);
            setTimeout(() => { consoleBox.innerHTML += "[+] Sending payload.bin to kernel space...<br>"; }, 1800);
            setTimeout(() => { consoleBox.innerHTML += "[+] ALL DONE! Exploit executed successfully!<br>"; }, 2800);
            setTimeout(() => {
                notification.innerText = "✨ تمت العملية بنجاح تام على واجهتك الشخصية!";
                notification.style.color = "#38bdf8";
            }, 3500);
        }

    })();

    function loadTool(name) {
        document.getElementById('state').innerText = "تم اختيار الأداة: " + name;
    }
    </script>
</body>
</html>
