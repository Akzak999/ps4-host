<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAKI GAME ARENA - PS4 Auto Exploit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0b0f19 url('bg.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .container { max-width: 1000px; width: 100%; background: rgba(11, 15, 25, 0.85); padding: 20px; border-radius: 20px; backdrop-filter: blur(5px); }
        
        .header {
            background: linear-gradient(135deg, rgba(19, 28, 46, 0.9), rgba(11, 15, 25, 0.9));
            border: 2px solid #1d4ed8;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 25px rgba(29, 78, 216, 0.4);
            margin-bottom: 25px;
        }
        .profile-section { display: flex; align-items: center; gap: 15px; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #38bdf8; object-fit: cover; box-shadow: 0 0 10px #38bdf8; }
        .user-info h2 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 5px; }
        .user-info p { color: #94a3b8; font-size: 0.9rem; }
        .logo-title { text-align: left; border-left: 2px solid #1d4ed8; padding-left: 15px; }
        .logo-title h1 { font-size: 1.8rem; color: #60a5fa; letter-spacing: 2px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }
        .logo-title span { color: #3b82f6; font-size: 0.8rem; display: block; }

        .status-bar {
            background: rgba(30, 41, 59, 0.9);
            border-right: 4px solid #38bdf8;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

        .payload-card {
            position: relative;
            background: #1e293b;
            border: 2px solid #3b82f6;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            height: 295px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            outline: none;
            width: 100%;
        }

        .payload-card:focus, .payload-card:hover {
            transform: translateY(-3px);
            border-color: #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.8);
        }

        .payload-card img.bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
            transition: opacity 0.3s ease;
        }

        .payload-card:focus img.bg-img, .payload-card:hover img.bg-img { opacity: 0.95; }

        .payload-content {
            position: relative;
            z-index: 2;
            background: linear-gradient(0deg, rgba(11, 15, 25, 0.95) 20%, transparent);
            padding: 20px 15px 15px 15px;
            text-align: center;
            width: 100%;
        }
        .payload-content h2 { color: #ffffff; text-shadow: 0 0 10px #000; font-size: 1.4rem; }
        .payload-content p { color: #38bdf8; text-shadow: 0 0 8px #000; font-weight: bold; margin-top: 4px; font-size: 0.85rem; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .game-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            outline: none;
            width: 100%;
        }

        .game-card:focus, .game-card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .game-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: opacity 0.3s ease; }
        .game-card:focus img, .game-card:hover img { opacity: 0.9; }
        .game-title { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(15, 23, 42, 0.95), transparent); padding: 10px; font-size: 0.9rem; font-weight: bold; color: #f8fafc; }

        .footer-bar { margin-top: 30px; background: rgba(15, 23, 42, 0.9); border-top: 1px solid #1e293b; padding: 15px; border-radius: 10px; color: #10b981; font-weight: bold; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="profile-section">
                <img src="profile.jpg" alt="Zaki" class="profile-img">
                <div class="user-info">
                    <h2>أهلاً بك، زكي!</h2>
                    <p>PLAYSTATION | PC GAMING | صيانة | فلاش ألعاب</p>
                </div>
            </div>
            <div class="logo-title">
                <h1>ZAKI</h1>
                <span>GAME ARENA</span>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="status-text">
            جاري فحص الجهاز...
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Left Side: GoldHEN Button -->
            <button class="payload-card" onclick="triggerGoldhen()">
                <img src="goldhen-user.jpg" alt="Zaki GoldHEN" class="bg-img">
                <div class="payload-content">
                    <h2>PAYLOAD MENU</h2>
                    <p>تفعيل GoldHEN مباشر</p>
                </div>
            </button>

            <!-- Right Side: Game Buttons -->
            <div class="games-grid">
                <button class="game-card" onclick="loadTool('God of War')">
                    <img src="gow.jpg" alt="God of War">
                    <div class="game-title">God of War (2018)</div>
                </button>

                <button class="game-card" onclick="loadTool('Spider-Man')">
                    <img src="spiderman.jpg" alt="Spider-Man">
                    <div class="game-title">Spider-Man</div>
                </button>

                <button class="game-card" onclick="loadTool('Uncharted 4')">
                    <img src="uncharted.jpg" alt="Uncharted 4">
                    <div class="game-title">Uncharted 4</div>
                </button>

                <button class="game-card" onclick="loadTool('App2USB')">
                    <img src="tools.jpg" alt="Tools">
                    <div class="game-title">أدوات الصيانة &amp; LaunchPad</div>
                </button>
            </div>
        </div>

        <!-- Footer Notification -->
        <div class="footer-bar" id="notification">
            جاهز للحقن المباشر بدون فلاشة USB.
        </div>
    </div>

    <script>
        // دالة التعرف التلقائي على نوع الجهاز (PS4 أو PC)
        function detectDeviceAndFW() {
            let ua = navigator.userAgent;
            let statusDiv = document.getElementById('status-text');
            
            if (ua.includes("PlayStation 4") || ua.includes("PlayStation")) {
                let match = ua.match(/PlayStation 4[^\)]*([0-9\.]+)/i);
                let fwVersion = (match && match[1]) ? match[1] : "مجهول";
                statusDiv.innerText = "🎮 متصل من جهاز: PlayStation 4 | الإصدار المكتشف: " + fwVersion;
                statusDiv.style.borderColor = "#38bdf8";
            } else {
                statusDiv.innerText = "💻 متصل من جهاز كمبيوتر (PC) للمعاينة والتعديل.";
                statusDiv.style.borderColor = "#10b981";
            }
        }

        // دالة تفعيل وحقن GoldHEN
        function triggerGoldhen() {
            let statusDiv = document.getElementById('status-text');
            statusDiv.innerText = "جاري جلب ملف goldhen.bin...";
            document.getElementById('notification').innerText = "يرجى الانتظار، جاري معالجة الحمولة...";

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'goldhen.bin', true);
            xhr.responseType = 'arraybuffer';
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    statusDiv.innerText = "تم العثور على ملف goldhen.bin! جاري تشغيل الثغرة والحقن...";
                    
                    // حقن ملف الـ Exploit الخارجي
                    let exploitScript = document.createElement('script');
                    exploitScript.src = 'exploit.js';
                    document.head.appendChild(exploitScript);
                    
                } else {
                    statusDiv.innerText = "خطأ: لم يتم العثور على ملف goldhen.bin في المجلد الرئيسي.";
                }
            };
            
            xhr.onerror = function() {
                statusDiv.innerText = "تعذر الاتصال بملف الحمولة.";
            };
            
            xhr.send();
        }

        function loadTool(name) {
            document.getElementById('status-text').innerText = "تم اختيار الأداة: " + name;
        }

        // تشغيل الفحص فور فتح الصفحة
        window.onload = function() {
            detectDeviceAndFW();
        };
    </script>
</body>
</html>
